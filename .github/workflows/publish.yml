name: Publish

on:
    workflow_dispatch:
        inputs:
            version:
                description: Release bump
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major
    # push:
    #     branches:
    #         - main
    #     paths:
    #         - .github/workflows/publish.yml
    #         - .goreleaser.yml
    #         - cli/**
    #         - npm/**
    #         - proto/**
    #         - scripts/deploy/**

permissions:
    contents: write
    id-token: write

# Queue, never cancel: a canceled run can leave a partial npm/GitHub release.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        if: github.actor != 'github-actions[bot]'
        name: Compute version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.compute.outputs.version }}
            tag: ${{ steps.compute.outputs.tag }}
            swift-key: ${{ steps.swift-key.outputs.key }}
            swift-cached: ${{ steps.swift-cache.outputs.cache-hit }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - id: compute
              env:
                  RELEASE_TYPE: ${{ inputs.version }}
              run: |
                  TAG="$(npm version "$RELEASE_TYPE" --prefix npm/cli --no-git-tag-version)"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

            # The macOS job runs only when this Swift source has no cached build,
            # so the release doesn't wait on (or get stuck behind) a macOS runner.
            - id: swift-key
              run: echo "key=swift-helpers-${{ hashFiles('cli/cmd/forged-auth/main.swift', 'cli/cmd/forged-auth/Info.plist') }}" >> "$GITHUB_OUTPUT"

            - id: swift-cache
              uses: actions/cache/restore@v6
              with:
                  path: build/forged-auth-release
                  key: ${{ steps.swift-key.outputs.key }}
                  lookup-only: true

    swift-helpers:
        needs: version
        if: needs.version.outputs.swift-cached != 'true'
        name: Build Swift helpers
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - id: cache
              uses: actions/cache@v6
              with:
                  path: build/forged-auth-release
                  key: ${{ needs.version.outputs.swift-key }}

            - if: steps.cache.outputs.cache-hit != 'true'
              run: ./scripts/deploy/build-auth-swift.sh

            - uses: actions/upload-artifact@v7
              with:
                  name: swift-helpers
                  path: build/forged-auth-release
                  retention-days: 1
                  if-no-files-found: error

    release:
        needs: [version, swift-helpers]
        # swift-helpers is skipped when its build is already cached.
        if: ${{ !cancelled() && needs.version.result == 'success' && (needs.swift-helpers.result == 'success' || needs.swift-helpers.result == 'skipped') }}
        name: Publish ${{ needs.version.outputs.tag }} to npm + GitHub Releases
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - if: needs.swift-helpers.result == 'success'
              uses: actions/download-artifact@v8
              with:
                  name: swift-helpers
                  path: build/forged-auth-release

            - if: needs.swift-helpers.result == 'skipped'
              uses: actions/cache/restore@v6
              with:
                  path: build/forged-auth-release
                  key: ${{ needs.version.outputs.swift-key }}
                  fail-on-cache-miss: true

            - run: find build/forged-auth-release -type f -name 'forged-auth' -exec chmod +x {} +

            - uses: actions/setup-go@v7
              with:
                  go-version-file: cli/go.mod
                  check-latest: true
                  cache-dependency-path: cli/go.sum

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup Git & SSH signing
              run: |
                  git config user.email "ritik.jarvis@gmail.com"
                  git config user.name "Jarvis"
                  mkdir -p ~/.ssh/
                  echo "${{ secrets.JARVIS_SSH_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan github.com >> ~/.ssh/known_hosts
                  git config gpg.format ssh
                  git config user.signingkey ~/.ssh/id_rsa
                  git config commit.gpgsign true
                  git config tag.gpgsign true

            - env:
                  NEW_VERSION: ${{ needs.version.outputs.version }}
              run: |
                  npm version "$NEW_VERSION" --prefix npm/cli --no-git-tag-version
                  node - <<'NODE' "npm/cli/package.json"
                  const fs = require("node:fs");
                  const [path] = process.argv.slice(2);
                  const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
                  for (const dependency of Object.keys(pkg.optionalDependencies || {})) {
                    pkg.optionalDependencies[dependency] = pkg.version;
                  }
                  fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
                  NODE

            - env:
                  NEW_TAG: ${{ needs.version.outputs.tag }}
              run: |
                  git add npm/cli/package.json
                  git commit -m "publish $NEW_TAG"
                  git tag -a "$NEW_TAG" -m "Release $NEW_TAG"

            - uses: goreleaser/goreleaser-action@v7
              with:
                  distribution: goreleaser
                  version: '~> v2'
                  install-only: true

            # CLI checks run alongside the build but still gate everything published or
            # pushed below. The log lives outside the repo so GoReleaser sees a clean tree.
            - name: Build release and check CLI
              run: |
                  (cd cli && go vet ./... && go vet -tags e2e ./... && go test ./...) > "$RUNNER_TEMP/cli-checks.log" 2>&1 &
                  checks=$!
                  goreleaser release --clean --skip=announce,publish,homebrew,nfpm,scoop
                  status=0
                  wait "$checks" || status=$?
                  echo "::group::CLI vet and test"
                  cat "$RUNNER_TEMP/cli-checks.log"
                  echo "::endgroup::"
                  if [ "$status" -ne 0 ]; then
                      echo "::error::CLI vet/test failed"
                      exit "$status"
                  fi

            - run: ./scripts/deploy/build-npm-packages.sh "${{ needs.version.outputs.version }}"

            - run: ./scripts/deploy/publish-npm-packages.sh "${{ needs.version.outputs.version }}"

            - run: git push --follow-tags origin HEAD:main

            - env:
                  GH_TOKEN: ${{ secrets.JARVIS_GH_PAT }}
              run: ./scripts/deploy/create-github-release.sh "${{ needs.version.outputs.tag }}"

            - env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: ./scripts/deploy/prune-orphan-tags.sh
